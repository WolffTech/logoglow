name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  test:
    name: Test
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: swift test

  build:
    name: Build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Assemble ad hoc signed app
        run: ./Scripts/make-app.sh
      - name: Verify app bundle
        run: ./Scripts/verify-app.sh
      - name: Package app
        run: ./Scripts/make-dmg.sh dist/Logo-Glow-test-build.dmg
      - name: Upload test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Logo-Glow-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/Logo-Glow-test-build.dmg
          if-no-files-found: error
          retention-days: 14

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CODESIGN_IDENTITY: 55ED9E89F9516108031C6CF7D42D2E77D4574BD1
      EXPECTED_TEAM_ID: 45QKSLQ5S4
    steps:
      - name: Check release credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Derive version from tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::release tags must use vMAJOR.MINOR.PATCH without leading zeros'
            exit 1
          fi
          {
            echo "APP_VERSION=${GITHUB_REF_NAME#v}"
            echo "BUILD_NUMBER=$(git rev-list --count HEAD)"
          } >> "$GITHUB_ENV"
      - name: Run tests
        run: swift test
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/logoglow-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/logoglow-cert.p12"
          security import "$RUNNER_TEMP/logoglow-cert.p12" -k "$keychain" \
            -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/logoglow-cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Sign, notarize, and verify
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          umask 077
          export NOTARY_KEY_FILE="$RUNNER_TEMP/logoglow-notary.p8"
          printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY_FILE"
          ./Scripts/notarize.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dmg="dist/Logo-Glow-$APP_VERSION.dmg"
          source_zip="dist/Logo-Glow-$APP_VERSION-source.zip"
          git archive --format=zip --prefix="Logo-Glow-$APP_VERSION/" \
            --output="$source_zip" "$GITHUB_SHA"
          checksums="dist/Logo-Glow-$APP_VERSION-SHA256SUMS.txt"
          (
            cd dist
            shasum -a 256 "${dmg#dist/}" "${source_zip#dist/}" > "${checksums#dist/}"
          )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" "$source_zip" "$checksums" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Logo Glow $APP_VERSION" \
              --generate-notes --verify-tag "$dmg" "$source_zip" "$checksums"
          fi
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/logoglow-notary.p8" "$RUNNER_TEMP/logoglow-cert.p12"
          if [[ -f "$RUNNER_TEMP/logoglow-release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/logoglow-release.keychain-db"
          fi
